name: Release ZIP

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ZIP file
        run: |
          zip -r "JAF_RoadServiceLivery.zip" \
            Brick \
            Icon_JAF.png \
            manifest.json \
            README.md \
            .gitignore

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: "JAF_RoadServiceLivery.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
